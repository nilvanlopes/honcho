services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      honcho:
        aliases:
          - postgres
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      honcho:
        aliases:
          - redis
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:1bd34a7178b00f822b951bb29944e696edcbc83cbf198ef36e3683571c71e9d4
    command:
      [
        "--model-id",
        "sentence-transformers/all-MiniLM-L6-v2",
        "--port",
        "80",
      ]
    environment:
      - HF_HOME=/data
      - HF_HUB_DISABLE_TELEMETRY=1
    volumes:
      - embeddings_cache:/data
    networks:
      honcho:
        aliases:
          - embeddings
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M

  api:
    image: ghcr.io/plastic-labs/honcho:v3.1.0@sha256:b73a8015f9e3ee51525e5b5cb238a915aa47de5107593d81b892213322fa369d
    command: ["sh", "docker/entrypoint.sh"]
    env_file: .env
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    networks:
      honcho:
        aliases:
          - api
    depends_on:
      - postgres
      - redis
      - embeddings
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.1.0@sha256:b73a8015f9e3ee51525e5b5cb238a915aa47de5107593d81b892213322fa369d
    command: ["/app/.venv/bin/python", "-m", "src.deriver"]
    env_file: .env
    networks:
      honcho:
        aliases:
          - deriver
    depends_on:
      - postgres
      - redis
      - embeddings
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

networks:
  honcho:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  embeddings_cache:
    driver: local
